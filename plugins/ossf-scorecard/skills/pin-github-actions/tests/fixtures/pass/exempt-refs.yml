# The three things that are correctly NOT pinned to a SHA: a local action, a
# docker image reference, and the SLSA generator (which resolves its own
# release from github.action_ref and breaks when given a SHA).
name: exempt
on: [push]
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - uses: docker://alpine:3.20
  provenance:
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: placeholder
