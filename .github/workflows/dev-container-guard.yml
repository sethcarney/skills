name: dev-container guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: check-devcontainer-auth fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The guard ships as part of the dev-container skill, so its own test
      # suite runs here. Fixtures cover each way the three-setting auth config
      # can silently drift.
      - name: Run guard test suite
        run: plugins/dev-container/skills/dev-container/tests/run-tests.sh

      # This repo now has a .devcontainer/ of its own, so this step guards for
      # real: the skill's own advice, held to its own standard.
      # --require-feature means dropping the Claude Code feature fails here
      # rather than silently downgrading the check to a skip.
      - name: Check this repo's own devcontainer.json
        run: |
          python3 plugins/dev-container/skills/dev-container/scripts/check-devcontainer-auth.py \
            --require-feature
